name: SPoT social auto-post

on:
  # No GitHub `schedule`: GitHub's cron started runs hours late and, after
  # crossing midnight IST, posted the evening slot at night. cron-job.org
  # dispatches this workflow at the intended IST times (social/CRON_BACKUP.md).
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which daily post to preview or manually publish?'
        required: true
        type: choice
        options:
          - morning
          - evening
        default: morning
      source:
        description: 'Manual or cron-job.org backup dispatch'
        required: true
        type: choice
        options:
          - manual
          - backup
        default: manual
      live:
        description: 'Publish now (also requires SPOT_SOCIAL_LIVE=true variable)'
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/spot-social.yml'
      - 'scripts/social-post.mjs'
      - 'scripts/social-content.mjs'
      - 'scripts/generate-social-images.py'
      - 'social/**'
      - 'tests/social-post.test.mjs'

permissions:
  contents: write

concurrency:
  group: spot-social-${{ github.ref }}
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'social/requirements.txt'
      - name: Install free image renderer
        run: python -m pip install -r social/requirements.txt
      - name: Validate social content and uniqueness checks
        run: node --test tests/social-post.test.mjs
      - name: Render a sample campaign Short (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          node scripts/social-post.mjs --sample-campaign
          python scripts/generate-social-images.py
          ls -la social/.video/*.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,codec_name -of csv=p=0 social/.video/*.mp4
      - name: Prepare unique slot content
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SPOT_POST_SLOT: ${{ inputs.slot }}
        run: node scripts/social-post.mjs --prepare
      - name: Install ffmpeg for campaign YouTube Shorts
        run: |
          if node -e "process.exit(require('./social/.prepared.json').video ? 0 : 1)"; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
      - name: Generate unique square JPEG for this slot
        run: |
          python scripts/generate-social-images.py
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          data = json.loads(Path('social/.prepared.json').read_text())
          file = Path('social/images') / data['filename']
          assert file.is_file()
          with Image.open(file) as img:
              assert img.format == 'JPEG'
              assert img.size == (1080, 1080)
          print('Validated unique image: ' + str(file))
          if data.get('video'):
              video = Path('social/.video') / data['video']
              assert video.is_file() and video.stat().st_size > 10000
              print('Validated YouTube Short: ' + str(video))
          PY
      - name: Save reviewable creative
        uses: actions/upload-artifact@v4
        with:
          name: spot-social-artwork
          path: |
            social/images/*.jpg
            social/.video/*.mp4
          retention-days: 7
      - name: Dry run or publish to Meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          SPOT_POST_SLOT: ${{ inputs.slot }}
          SPOT_TRIGGER_SOURCE: ${{ inputs.source }}
          SPOT_MANUAL_LIVE: ${{ inputs.live }}
          SPOT_SOCIAL_LIVE: ${{ vars.SPOT_SOCIAL_LIVE }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node scripts/social-post.mjs
